<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PegBand</title>
<style>
  :root {
    --bg: #11131a; --panel: #1a1d27; --line: #2c3040; --ink: #e8eaf2; --dim: #9aa0b5;
    --green: #35c47a; --blue: #4d8dff; --both: #b07bff; --gold: #ffcf5c;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header .meta { color: var(--dim); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; padding: 18px 20px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .card h2 {
    margin: 0; padding: 11px 14px; font-size: 12px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--dim); border-bottom: 1px solid var(--line);
  }
  .card .body { padding: 14px; }

  /* The scoreboard above the board */
  .scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
            padding: 12px 14px; }
  .side { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .side.blue { justify-content: flex-end; text-align: right; }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; }
  .dot.g { background: var(--green); } .dot.b { background: var(--blue); }
  .who { min-width: 0; }
  .who .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .cl { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .who .cl.low { color: var(--gold); }
  .pts { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pts.g { color: var(--green); } .pts.b { color: var(--blue); }
  .vs { color: var(--dim); font-size: 12px; text-align: center; }
  .thinking { animation: pulse 1s ease-in-out infinite; }
  .who .role { color: var(--dim); font-size: 11.5px; }
  .who .role b.rg { color: var(--green); } .who .role b.rb { color: var(--blue); }
  .side.blue .who { text-align: right; }
  .vs .lead { font-size: 11.5px; margin-top: 3px; }
  /* Marks for the side that is ahead and the side to play. */
  .side.ahead .nm::after { content: " ◂ ahead"; color: var(--gold); font-weight: 600; font-size: 11px; }
  .side.turn .dot { box-shadow: 0 0 0 4px rgba(255,207,92,.35); }
  .side.turn .role::after { content: " · to play"; color: var(--gold); font-weight: 600; }
  .side.blue.ahead .nm::after { content: none; }
  .side.blue.ahead .nm::before { content: "ahead ▸ "; color: var(--gold); font-weight: 600; font-size: 11px; }
  .out { font-weight: 700; font-size: 11px; letter-spacing: .04em; }
  .out.won { color: var(--gold); } .out.lost { color: var(--dim); }
  .banner {
    display: none; margin: 0 14px 12px; padding: 10px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: #20242f; font-size: 14px;
  }
  .banner.show { display: block; }
  .banner b { color: var(--gold); }
  .banner .sub { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* The board */
  .boardwrap { padding: 8px 14px 14px; }
  /* The board is square, so sizing it by width alone makes it taller than the window. Size it by
     the window's height instead (leaving room for the scoreboard and controls); the drawing
     scales to fit inside and stays centred. */
  svg.board { width: 100%; height: calc(100vh - 430px); min-height: 300px; max-height: 760px;
              display: block; touch-action: none; }

  /* Controls */
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
              padding: 11px 14px; border-top: 1px solid var(--line); }
  button {
    background: #262a38; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #30354a; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=range] { flex: 1; min-width: 110px; accent-color: var(--green); }
  .step { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 92px; }

  /* The move list */
  .moves { max-height: 300px; overflow: auto; }
  .mv { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: baseline;
        padding: 5px 14px; border-bottom: 1px solid #22263200; font-size: 13px; cursor: pointer; }
  .mv:hover { background: #22263a; }
  .mv.here { background: #2a2f44; }
  .mv .sw { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; }
  .mv .gain { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; }
  .mv.bad .what { color: #ff8a8a; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 12px;
            padding: 10px 14px; border-top: 1px solid var(--line); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block;
              margin-right: 5px; vertical-align: -1px; }
  .games { display: flex; gap: 8px; padding: 10px 14px 0; }
  .games button.on { border-color: var(--green); color: var(--green); }
  .note { color: var(--dim); font-size: 12px; padding: 4px 14px; }
  .final { padding: 12px 14px; font-size: 14px; }
  .final b { color: var(--gold); }
</style>
</head>
<body>
<header>
  <h1>PegBand</h1>
  <span class="meta" id="meta"></span>
  <span class="meta" id="status"></span>
</header>

<div class="wrap">
  <div>
    <div class="card">
      <div class="games" id="games"></div>
      <div class="scores">
        <div class="side" id="gside">
          <span class="dot g"></span>
          <div class="who">
            <div class="nm" id="gname">Green</div>
            <div class="role">plays <b class="rg">Green</b> · first <span id="gout"></span></div>
            <div class="cl" id="gclock"></div>
          </div>
          <div class="pts g" id="gpts">0</div>
        </div>
        <div class="vs">
          <div id="phase">–</div>
          <div class="lead" id="lead"></div>
        </div>
        <div class="side blue" id="bside">
          <div class="pts b" id="bpts">0</div>
          <div class="who">
            <div class="nm" id="bname">Blue</div>
            <div class="role">plays <b class="rb">Blue</b> · second <span id="bout"></span></div>
            <div class="cl" id="bclock"></div>
          </div>
          <span class="dot b"></span>
        </div>
      </div>
      <div class="banner" id="banner"></div>
      <div class="boardwrap"><svg class="board" id="svg"></svg></div>
      <div class="controls" id="controls">
        <button id="first">⏮</button><button id="prev">◀</button>
        <button id="play">▶ Play</button>
        <button id="next">▶</button><button id="last">⏭</button>
        <span class="step" id="step"></span>
        <input type="range" id="scrub" min="0" max="0" value="0">
      </div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>Green cover</span>
        <span><i style="background:var(--blue)"></i>Blue cover</span>
        <span><i style="background:var(--both)"></i>Both</span>
        <span>Squares with an enemy peg never score.</span>
      </div>
      <div class="final" id="final"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>Referee notes</h2>
      <div id="notes"><div class="note">None.</div></div>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const SVG = 'http://www.w3.org/2000/svg';
const GREEN = 0, BLUE = 1;

let state = null;      // the match
let gameIx = 0;        // which of the two games is shown
let step = 0;          // how many moves of that game are shown
let timer = null;      // the play timer

// ---------------------------------------------------------------- drawing

function el(name, attrs, parent) {
  const n = document.createElementNS(SVG, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

/** Draw the board: the grid, the cover of each player, the bands and the pegs. */
function draw(n, board, cover, bands, lastHull) {
  const svg = $('svg');
  svg.innerHTML = '';
  const cell = 28, pad = 10;
  const size = n * cell + pad * 2;
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  const X = c => pad + c * cell + cell / 2;        // centre of column c
  const Y = r => pad + r * cell + cell / 2;

  // The squares each player's bands cover, painted under everything else.
  const g = new Set(cover ? cover[0] : []), b = new Set(cover ? cover[1] : []);
  for (let i = 0; i < n * n; i++) {
    const inG = g.has(i), inB = b.has(i);
    if (!inG && !inB) continue;
    const r = Math.floor(i / n), c = i % n;
    el('rect', {x: pad + c * cell, y: pad + r * cell, width: cell, height: cell,
                fill: inG && inB ? 'var(--both)' : inG ? 'var(--green)' : 'var(--blue)',
                opacity: inG && inB ? .32 : .22}, svg);
  }

  // The grid.
  for (let i = 0; i <= n; i++) {
    const p = pad + i * cell;
    el('line', {x1: pad, y1: p, x2: pad + n * cell, y2: p, stroke: 'var(--line)'}, svg);
    el('line', {x1: p, y1: pad, x2: p, y2: pad + n * cell, stroke: 'var(--line)'}, svg);
  }

  // The rubberbands themselves: each is the convex hull of the pegs it was stretched around.
  (bands || []).forEach((list, player) => {
    (list || []).forEach(hull => {
      if (!hull || !hull.length) return;
      const col = player === GREEN ? 'var(--green)' : 'var(--blue)';
      const pts = hull.map(([r, c]) => `${X(c)},${Y(r)}`).join(' ');
      const isLast = lastHull && JSON.stringify(lastHull) === JSON.stringify(hull);
      const w = isLast ? 3 : 1.8;
      if (hull.length >= 3) {
        el('polygon', {points: pts, fill: col, 'fill-opacity': .1,
                       stroke: col, 'stroke-width': w, 'stroke-linejoin': 'round'}, svg);
      } else if (hull.length === 2) {
        el('line', {x1: X(hull[0][1]), y1: Y(hull[0][0]), x2: X(hull[1][1]), y2: Y(hull[1][0]),
                    stroke: col, 'stroke-width': w, 'stroke-linecap': 'round'}, svg);
      } else {
        el('circle', {cx: X(hull[0][1]), cy: Y(hull[0][0]), r: 5, fill: 'none',
                      stroke: col, 'stroke-width': w}, svg);
      }
    });
  });

  // The pegs, on top.
  for (let i = 0; i < n * n; i++) {
    if (!board[i]) continue;
    const r = Math.floor(i / n), c = i % n;
    el('circle', {cx: X(c), cy: Y(r), r: Math.max(3, cell * .2),
                  fill: board[i] === 1 ? 'var(--green)' : 'var(--blue)',
                  stroke: '#0d0f16', 'stroke-width': 1.5}, svg);
  }
}

// ------------------------------------------------- rebuilding a game state

/** Replay the first `upto` moves of a game and return what the board looks like then. */
function rebuild(game, upto) {
  const n = state.params.N;
  const board = new Array(n * n).fill(0);
  const cover = [new Set(), new Set()];
  const bands = [[], []];
  const pegs = [[], []];
  let last = null;
  const moves = game.moves || [];
  for (let i = 0; i < Math.min(upto, moves.length); i++) {
    const m = moves[i];
    if (m.phase === 'pegs') {
      if (m.peg !== null && m.peg !== undefined) {
        board[m.peg] = m.player + 1;
        pegs[m.player].push(m.peg);
      }
    } else if (m.band) {
      bands[m.player].push(m.band.hull);
      // A square with an enemy peg never scores, so take those out of the cover.
      const enemy = new Set(pegs[1 - m.player]);
      m.band.cover.forEach(sq => { if (!enemy.has(sq)) cover[m.player].add(sq); });
      last = m.band.hull;
    }
  }
  return {board, cover: [[...cover[0]], [...cover[1]]], bands, last,
          scores: [cover[0].size, cover[1].size]};
}

/** Mark who is ahead, or once the game is over, who won. Green moves first and wins a tie. */
function markSides(game, scores, over) {
  const [g, b] = scores;
  $('gside').classList.toggle('ahead', !over && g > b);
  $('bside').classList.toggle('ahead', !over && b > g);
  $('lead').innerHTML = over ? '' : g === b
    ? '<span style="color:var(--dim)">level, Green wins a tie</span>'
    : `<span style="color:var(--${g > b ? 'green' : 'blue'})">` +
      `${esc(g > b ? game.green : game.blue)} +${Math.abs(g - b)}</span>`;

  const gout = $('gout'), bout = $('bout');
  if (!over) { gout.className = bout.className = ''; gout.textContent = bout.textContent = ''; return; }
  gout.className = 'out ' + (g >= b ? 'won' : 'lost');
  bout.className = 'out ' + (b > g ? 'won' : 'lost');
  gout.textContent = g > b ? '· WON' : g === b ? '· WON (tie)' : '· lost';
  bout.textContent = b > g ? '· WON' : b === g ? '· lost (tie)' : '· lost';
}

function phaseLabel(game, upto) {
  const moves = game.moves || [];
  if (!upto) return 'before the first move';
  const m = moves[Math.min(upto, moves.length) - 1];
  if (!m) return '';
  return m.phase === 'pegs' ? `pegs · round ${m.round + 1}` : `rubberbands · round ${m.round + 1}`;
}

  const game = games[gameIx];
  $('meta').textContent = state.params
    ? `${state.params.N}×${state.params.N} board · ${state.params.pegs} pegs each · ${state.params.bands} rubberbands each`
    : '';
  $('status').textContent = state.status || '';

  // The two game tabs.
  const tabs = $('games');
  if (tabs.childElementCount !== games.length) {
    tabs.innerHTML = '';
    games.forEach((gs, i) => {
      const b = document.createElement('button');
      b.textContent = `Game ${gs.game}`;
      b.onclick = () => { gameIx = i; step = (games[i].moves || []).length; stopPlay(); render(); };
      tabs.appendChild(b);
    });
  }
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === gameIx));

  if (!game) return;
  const moves = game.moves || [];
  step = Math.max(0, Math.min(step, moves.length));
  const st = rebuild(game, step);

  $('gname').textContent = game.green || 'Green';
  $('bname').textContent = game.blue || 'Blue';
  $('gpts').textContent = st.scores[0];
  $('bpts').textContent = st.scores[1];
  $('phase').textContent = phaseLabel(game, step);
  markSides(game, st.scores, step >= (game.moves || []).length && game.status === 'finished');

  // Clocks: live ones while a game is being played, otherwise what was left at this move.
  const atMove = moves[step - 1];
  const clocks = (live && state.live_clocks) ? state.live_clocks
                 : (atMove ? atMove.clocks : [state.time_budget, state.time_budget]);
  [['gclock', 0], ['bclock', 1]].forEach(([id, p]) => {
    const node = $(id);
    const secs = clocks ? clocks[p] : null;
    node.textContent = secs === null || secs === undefined ? '' : `${secs.toFixed(1)}s left`;
    node.classList.toggle('low', secs !== null && secs !== undefined && secs < 15);
    node.classList.toggle('thinking', !!(live && state.thinking && state.thinking[p]));
  });

  draw(state.params.N, st.board, st.cover, st.bands, st.last);

  $('scrub').max = moves.length;
  $('scrub').value = step;
  $('step').textContent = `${step} / ${moves.length}`;
  drawMoves(game, moves);
  drawNotes(game);
  drawFinal(game);
}

function drawMoves(game, moves) {
  const box = $('moves');
  box.innerHTML = '';
  moves.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'mv' + (i === step - 1 ? ' here' : '') + (m.refused ? ' bad' : '');
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = m.player === GREEN ? 'var(--green)' : 'var(--blue)';
    const what = document.createElement('span');
    what.className = 'what';
    if (m.refused) {
      what.textContent = m.refused;
    } else if (m.phase === 'pegs') {
      what.textContent = `peg on ${m.peg}`;
    } else {
      what.textContent = `band around ${m.band.pegs.join(', ')}`;
    }
    const gain = document.createElement('span');
    gain.className = 'gain';
    gain.textContent = m.phase === 'bands' && m.band ? `+${m.band.new.length}` : '';
    row.append(sw, what, gain);
    row.onclick = () => { step = i + 1; stopPlay(); render(); };
    box.appendChild(row);
  });
  const here = box.querySelector('.here');
  if (here) here.scrollIntoView({block: 'nearest'});
}

function drawNotes(game) {
  const box = $('notes');
  const notes = game.notes || [];
  box.innerHTML = '';
  if (!notes.length) { box.innerHTML = '<div class="note">None.</div>'; return; }
  notes.slice(-40).forEach(t => {
    const d = document.createElement('div');
    d.className = 'note';
    d.textContent = t;
    box.appendChild(d);
  });
}

function drawFinal(game) {
  const s = state.summary;
  const banner = $('banner');
  if (!s) {
    $('final').textContent = '';
    // No match summary yet, but this one game may be over: say who took it.
    const moves = game.moves || [];
    if (game.status === 'finished' && step >= moves.length) {
      const [g, b] = (game.scores || [0, 0]);
      const who = g >= b ? game.green : game.blue;
      banner.className = 'banner show';
      banner.innerHTML = `<b>${esc(who)} wins game ${game.game}</b>, ${g} – ${b}` +
        (g === b ? ' (a tie, and Green moved first).' : ` playing ${g > b ? 'Green' : 'Blue'}.`) +
        errLine(game);
    } else { banner.className = 'banner'; }
    return;
  }
  const names = Object.keys(s.totals || {});
  const line = names.map(n => `<b style="color:var(--ink)">${esc(n)}</b> ${s.totals[n]}`).join(' &nbsp;·&nbsp; ');
  const gap = names.length === 2 ? Math.abs(s.totals[names[0]] - s.totals[names[1]]) : 0;
  $('final').innerHTML = `Totals over both games: ${line}.`;
  // While someone is scrubbing back through the game, the result would give away an ending
  // they have not reached yet, and contradict the score on show. Keep it for the last move.
  if (step < (game.moves || []).length) { banner.className = 'banner'; return; }
  banner.className = 'banner show';
  const perGame = (s.games || []).map(x => {
    const sc = x.scores || [0, 0];
    const who = sc[0] >= sc[1] ? x.green : x.blue;
    return `Game ${x.game}: ${esc(who)} ${Math.max(...sc)}–${Math.min(...sc)}`;
  }).join(' · ');
  banner.innerHTML = (s.winner
      ? `<b>${esc(s.winner)} wins the match</b> by ${gap} point${gap === 1 ? '' : 's'}.`
      : '<b>The match is a tie.</b>') +
    `<div class="sub">${line}. ${perGame}</div>`;
}

/** A line naming any bot that failed, so a win by forfeit is never mistaken for a win on play. */
function errLine(game) {
  const errs = (game.errors || []).map((e, i) => e ? `${i === 0 ? 'Green' : 'Blue'}: ${e}` : null)
                                  .filter(Boolean);
  return errs.length ? `<div class="sub">Forfeit: ${esc(errs.join('; '))}</div>` : '';
}

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ---------------------------------------------------------------- controls

function stopPlay() { if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ Play'; } }

$('play').onclick = () => {
  if (timer) return stopPlay();
  $('play').textContent = '⏸ Pause';
  timer = setInterval(() => {
    const moves = (state.games[gameIx].moves) || [];
    if (step >= moves.length) return stopPlay();
    step++; render();
  }, 420);
};
$('first').onclick = () => { stopPlay(); step = 0; render(); };
$('prev').onclick = () => { stopPlay(); step = Math.max(0, step - 1); render(); };
$('next').onclick = () => { stopPlay(); step++; render(); };
$('last').onclick = () => { stopPlay(); step = (state.games[gameIx].moves || []).length; render(); };
$('scrub').oninput = e => { stopPlay(); step = +e.target.value; render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') $('prev').click();
  if (e.key === 'ArrowRight') $('next').click();
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

// ------------------------------------------------------------------ start

if (DATA) {
  state = DATA;
  gameIx = Math.max(0, (state.games || []).length - 1);
  step = ((state.games[gameIx] || {}).moves || []).length;
  render();
} else {
  // Live: the dashboard serves this same page while a match is being played.
  $('controls').style.display = 'none';
  const poll = async () => {
    try {
      const r = await fetch('/state');
      const s = await r.json();
      if (s.now) {
        // Build a one-game view straight from the live snapshot.
        state = {params: s.now ? {N: s.now.N, pegs: (s.params || {}).pegs, bands: (s.params || {}).bands} : s.params,
                 status: s.status, names: s.names, time_budget: s.time_budget,
                 live_clocks: s.live_clocks, thinking: s.thinking,
                 games: [{game: (s.games[s.games.length - 1] || {}).game || 1,
                          green: (s.games[s.games.length - 1] || {}).green,
                          blue: (s.games[s.games.length - 1] || {}).blue,
                          moves: [], notes: s.notes || []}]};
        gameIx = 0;
        // The live snapshot already holds the finished board, so draw it directly.
        $('meta').textContent = `${s.now.N}×${s.now.N} board`;
        $('status').textContent = s.status || '';
        const g = s.games[s.games.length - 1] || {};
        $('gname').textContent = g.green || 'Green';
        $('bname').textContent = g.blue || 'Blue';
        $('gpts').textContent = s.now.scores[0];
        $('bpts').textContent = s.now.scores[1];
        $('phase').textContent = `${s.now.phase} · round ${s.now.round + 1}`;
        // Who is ahead, and whose turn it is right now.
        markSides({green: g.green, blue: g.blue, moves: [], status: 'playing'}, s.now.scores, false);
        $('gside').classList.toggle('turn', s.now.turn === 0);
        $('bside').classList.toggle('turn', s.now.turn === 1);
        [['gclock', 0], ['bclock', 1]].forEach(([id, p]) => {
          const node = $(id);
          const secs = s.live_clocks ? s.live_clocks[p] : null;
          node.textContent = secs === null || secs === undefined ? '' : `${secs.toFixed(1)}s left`;
          node.classList.toggle('low', secs !== null && secs < 15);
          node.classList.toggle('thinking', !!(s.thinking && s.thinking[p]));
        });
        draw(s.now.N, s.now.board, s.now.cover, s.now.bands, null);
        const box = $('notes');
        box.innerHTML = '';
        (s.notes || []).forEach(t => {
          const d = document.createElement('div'); d.className = 'note'; d.textContent = t;
          box.appendChild(d);
        });
        if (!(s.notes || []).length) box.innerHTML = '<div class="note">None.</div>';
      } else {
        $('status').textContent = s.status || '';
      }
    } catch (e) { /* the server may be busy between matches */ }
  };
  poll();
  setInterval(poll, 400);
}
</script>
</body>
</html>
